spring:
  application:
    name: optimistic_lock

  datasource:
    url: jdbc:postgresql://localhost:5432/optimistic_lock
    username: flow_manager
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
