databaseChangeLog:
  - changeSet:
          id: 001-create-file-entity
          author: optimistic_lock
          changes:
            - createTable:
                tableName: users
                columns:
                  - column:
                      name: id
                      type: BIGINT
                      autoIncrement: true
                      constraints:
                        primaryKey: true

                  - column:
                      name: first_name
                      type: VARCHAR(255)

                  - column:
                      name: last_name
                      type: VARCHAR(255)

                  - column:
                      name: phone
                      type: VARCHAR(255)

                  - column:
                      name: email
                      type: VARCHAR(255)

                  - column:
                      name: age
                      type: VARCHAR(255)

                  - column:
                      name: createdAt
                      type: TIMESTAMP

                  - column:
                      name: version
                      type: INT